<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circuit Background — demo</title>

<link rel="stylesheet" href="circuit-background.css">
<style>
  /* --- demo page content only; replace all of this with your portfolio --- */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #020402;
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    color: #cfeee6;
  }
  .cbg-content { height: 100%; display: grid; place-items: center; padding: 6vw; }
  .card { text-align: center; }
  .card h1 {
    font-size: clamp(2rem, 7vw, 4.5rem);
    font-weight: 600;
    letter-spacing: .06em;
    color: #ffffff;
    text-shadow: 0 0 30px rgba(2, 20, 6, .95);
  }
  .card p {
    margin-top: 1.1rem;
    font-size: clamp(.75rem, 1.6vw, .95rem);
    letter-spacing: .34em;
    text-transform: uppercase;
    color: #fafafa;
  }
</style>
</head>
<body>

  <!-- Background mounts itself here (or creates its own container). -->

  <!-- Your content. The .cbg-content class just sets position:relative; z-index:1
       so it sits above the background. -->
  <main class="cbg-content">
    <div class="card">
      <h1>Andrew</h1>
      <p>replace with your content</p>
    </div>
  </main>

  <script src="circuit-background.js" defer></script>
</body>
</html>
